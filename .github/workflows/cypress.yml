name: Cypress Tests

on:
  push:
  workflow_dispatch:

jobs:
  cypress-run:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox, edge]

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Cypress Tests ausführen
        uses: cypress-io/github-action@v6
        with:
          browser: ${{ matrix.browser }}
